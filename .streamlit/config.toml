[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#0f172a"

[server]
# Research PDFs are large. Default is 200MB; keep headroom but stay under
# Community Cloud's memory ceiling - a 200MB PDF will OOM the container.
maxUploadSize = 50

[browser]
gatherUsageStats = false
